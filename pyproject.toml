[project]
name = "text2flow"
version = "0.1.0"
description = "A lightweight, high-performance web application that converts simple text syntax into professional SVG/PNG flowcharts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "coverage==7.14.1",
    "fastapi==0.137.1",
    "graphviz==0.21",
    "httpx2==2.4.0",
    "hypothesis==6.155.3",
    "jinja2==3.1.6",
    "pyragify==0.1.0",
    "pytest==9.1.0",
    "pytest-cov==7.1.0",
    "pyyaml==6.0.3",
    "uvicorn==0.49.0",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

addopts = [
    "--cov=app",
    "--cov=gui_app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-branch",
]
